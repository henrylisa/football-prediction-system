name: Daily football predictions

on:
  schedule:
    - cron: "15 3 * * *"   # 06:15 East Africa Time when UTC+3
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: mkdir -p data models reports
      - run: python -m app.cli daily
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: daily-prediction-report
          path: reports/
