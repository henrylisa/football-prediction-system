api:
  base_url: https://v3.football.api-sports.io
  timeout_seconds: 30

model:
  recent_matches: 8
  min_training_matches: 150
  home_advantage: 0.20
  poisson_max_goals: 8
  value_edge_threshold: 0.05

leagues:
  # API-Football league IDs. Add/remove competitions as required.
  # Examples: Premier League=39, La Liga=140, Serie A=135,
  # Bundesliga=78, Ligue 1=61.
  - id: 39
    name: Premier League
    season: 2024

  - id: 140
    name: La Liga
    season: 2024

  - id: 135
    name: Serie A
    season: 2024

  - id: 78
    name: Bundesliga
    season: 2024

  - id: 61
    name: Ligue 1
    season: 2024

report:
  output_dir: reports
  top_n: 20
